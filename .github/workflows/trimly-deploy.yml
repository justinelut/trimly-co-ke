# =============================================================================
# Trimly — build & deploy to K3s
#
# On every push to main:
#   1. Build the Docker image
#   2. Push to ghcr.io/<owner>/trimly-co-ke:<sha> and :latest
#   3. SSH into the K3s server, kubectl apply manifests, set the new image
#      tag on the Deployment, and wait for the rollout
#
# Prisma migrations are NOT run here (deliberate — see AGENTS.md §2 and the
# Trimly build brief §2). Run them by hand after a schema change with:
#   kubectl delete job trimly-co-ke-migrate -n trimly-co-ke --ignore-not-found
#   kubectl apply -f k8s/migrate-job.yaml
#   kubectl logs -f job/trimly-co-ke-migrate -n trimly-co-ke
# =============================================================================
name: Build & Deploy

on:
  push:
    branches: [main]
    paths:
      # Only trigger Trimly deploy when files relevant to it change.
      # Cal-only paths (cron-*.yml, app-store internals, etc.) won't redeploy.
      - 'apps/web/**'
      - 'packages/prisma/schema.prisma'
      - 'packages/**'
      - 'k8s/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/trimly-deploy.yml'
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false        # never cancel a running deploy

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/trimly-co-ke
  K3S_NAMESPACE: trimly-co-ke
  K3S_DEPLOYMENT: trimly-co-ke-deployment
  K3S_CONTAINER: web

jobs:
  # ---------------------------------------------------------------------------
  # 1. Build & push to GHCR
  # ---------------------------------------------------------------------------
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write              # required to push to GHCR
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
      image-ref: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GitHub-hosted ubuntu-latest runners start with ~14GB free disk. Cal's
      # multi-stage Dockerfile (three full node_modules snapshots, Prisma
      # artifacts, embed bundles, .next caches) blows past that and the build
      # ENOSPCs at the final COPY. This action prunes preinstalled tools we
      # don't need (Android SDK, .NET, ghc, large package caches) and gets us
      # back to ~50GB free. Adds ~60s to the run, saves the build.
      - name: Free disk space on runner
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false        # keep Node toolchain
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false     # we need buildx layer cache
          swap-storage: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile               # cal.diy's existing multi-stage Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Build args. Real DATABASE_URL/NEXTAUTH_SECRET/etc. are injected at
          # runtime via the Kubernetes Secret — these are just placeholders so
          # Prisma client generation + Next.js build can complete.
          build-args: |
            BUILD_STANDALONE=true
            NEXT_PUBLIC_WEBAPP_URL=https://trimly.co.ke
            NEXT_PUBLIC_API_V2_URL=https://trimly.co.ke/api
            DATABASE_URL=postgres://build:build@localhost:5432/build
            NEXTAUTH_SECRET=build-time-placeholder-replaced-at-runtime
            CALENDSO_ENCRYPTION_KEY=build_time_encryption_key_32chr
            CALCOM_TELEMETRY_DISABLED=1
            MAX_OLD_SPACE_SIZE=6144
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false        # smaller manifest, faster pull on K3s

  # ---------------------------------------------------------------------------
  # 2. Deploy to K3s via SSH
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to K3s
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SERVER_IP }}" >> ~/.ssh/known_hosts

      - name: Copy manifests to server
        run: |
          ssh -i ~/.ssh/id_ed25519 ubuntu@${{ secrets.SERVER_IP }} \
            "mkdir -p ~/deploy/trimly-co-ke"
          scp -i ~/.ssh/id_ed25519 -r k8s/* \
            ubuntu@${{ secrets.SERVER_IP }}:~/deploy/trimly-co-ke/

      - name: Apply manifests & roll deployment
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image-tag }}
        run: |
          ssh -i ~/.ssh/id_ed25519 ubuntu@${{ secrets.SERVER_IP }} bash -s <<EOF
            set -euo pipefail

            cd ~/deploy/trimly-co-ke

            # Apply manifests EXCEPT secret.yaml and ghcr-pull-secret.yaml —
            # those are templates with placeholder values. The real secrets
            # are created out-of-band by the operator (see docs/DEPLOYMENT.md).
            for f in namespace.yaml configmap.yaml postgres.yaml minio.yaml deploy.yaml cronjobs.yaml; do
              echo "==> kubectl apply -f \$f"
              kubectl apply -f "\$f"
            done

            # Set the image to the freshly built tag.
            kubectl set image deployment/${K3S_DEPLOYMENT} \
              ${K3S_CONTAINER}=${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG} \
              --namespace ${K3S_NAMESPACE}

            # Wait for the rollout. Fail the workflow if pods don't come up.
            kubectl rollout status deployment/${K3S_DEPLOYMENT} \
              --namespace ${K3S_NAMESPACE} \
              --timeout=5m
          EOF

      - name: Summary
        if: always()
        run: |
          echo "### Deploy summary" >> $GITHUB_STEP_SUMMARY
          echo "- Image: \`${REGISTRY}/${IMAGE_NAME}:${{ needs.build.outputs.image-tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Namespace: \`${K3S_NAMESPACE}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Deployment: \`${K3S_DEPLOYMENT}\`" >> $GITHUB_STEP_SUMMARY
          echo "- URL: https://trimly.co.ke" >> $GITHUB_STEP_SUMMARY
