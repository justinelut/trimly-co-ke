# =============================================================================
# Trimly — build & deploy to K3s
#
# On every push to main:
#   1. Build the Docker image
#   2. Push to ghcr.io/<owner>/trimly-co-ke:<sha> and :latest
#   3. SSH into the K3s server, kubectl apply manifests, set the new image
#      tag on the Deployment, and wait for the rollout
#
# Prisma migrations are NOT run here (deliberate — see AGENTS.md §2 and the
# Trimly build brief §2). Run them by hand after a schema change with:
#   kubectl delete job trimly-co-ke-migrate -n trimly-co-ke --ignore-not-found
#   kubectl apply -f k8s/migrate-job.yaml
#   kubectl logs -f job/trimly-co-ke-migrate -n trimly-co-ke
# =============================================================================
name: Build & Deploy

on:
  push:
    branches: [main]
    paths:
      # Only trigger Trimly deploy when files relevant to it change.
      # Cal-only paths (cron-*.yml, app-store internals, etc.) won't redeploy.
      - 'apps/web/**'
      - 'packages/prisma/schema.prisma'
      - 'packages/**'
      - 'k8s/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/trimly-deploy.yml'
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false        # never cancel a running deploy

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/trimly-co-ke
  K3S_NAMESPACE: trimly-co-ke
  K3S_DEPLOYMENT: trimly-co-ke-deployment
  K3S_CONTAINER: web

jobs:
  # ---------------------------------------------------------------------------
  # 1. Build & push to GHCR
  # ---------------------------------------------------------------------------
  build:
    name: Build & push image
    # Native ARM64 runner — builds at full speed without QEMU emulation.
    # K3s nodes are ARM, so building on an ARM runner produces the right
    # arch directly. Requires a paid GitHub plan for private repos.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write              # required to push to GHCR
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
      image-ref: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GHA runners start with ~14GB free disk. Cal's multi-stage Dockerfile
      # (three full node_modules snapshots, Prisma artifacts, embed bundles,
      # .next caches) blows past that. This action prunes preinstalled tools
      # we don't need and gets us back to ~50GB free. Adds ~60s to the run.
      - name: Free disk space on runner
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false        # keep Node toolchain
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false     # we need buildx layer cache
          swap-storage: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile               # cal.diy's existing multi-stage Dockerfile
          push: true
          platforms: linux/arm64           # K3s nodes are ARM64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Build args. Real DATABASE_URL/NEXTAUTH_SECRET/etc. are injected at
          # runtime via the Kubernetes Secret — these are just placeholders so
          # Prisma client generation + Next.js build can complete.
          build-args: |
            BUILD_STANDALONE=true
            NEXT_PUBLIC_WEBAPP_URL=https://trimly.co.ke
            NEXT_PUBLIC_API_V2_URL=https://trimly.co.ke/api
            DATABASE_URL=postgres://build:build@localhost:5432/build
            NEXTAUTH_SECRET=build-time-placeholder-replaced-at-runtime
            CALENDSO_ENCRYPTION_KEY=build_time_encryption_key_32chr
            CALCOM_TELEMETRY_DISABLED=1
            MAX_OLD_SPACE_SIZE=6144
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false        # smaller manifest, faster pull on K3s

  # ---------------------------------------------------------------------------
  # 2. Deploy to K3s via SSH (appleboy actions — handle keepalive internally)
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to K3s
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create target directory on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo mkdir -p /opt/trimly-co-ke/k8s
            sudo chown -R ubuntu:ubuntu /opt/trimly-co-ke

      - name: Copy k8s manifests to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "k8s/namespace.yaml,k8s/configmap.yaml,k8s/postgres.yaml,k8s/minio.yaml,k8s/deploy.yaml,k8s/cronjobs.yaml,k8s/ingress.yaml,k8s/middleware-redirect.yaml"
          target: "/opt/trimly-co-ke/k8s/"
          strip_components: 1

      - name: Apply manifests and roll deployment
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image-tag }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: IMAGE_TAG
          command_timeout: 10m
          script: |
            set -e
            cd /opt/trimly-co-ke/k8s

            # secret.yaml and ghcr-pull-secret.yaml are templates — applied
            # out-of-band on first bootstrap (see docs/DEPLOYMENT.md).
            for f in namespace.yaml configmap.yaml postgres.yaml minio.yaml deploy.yaml cronjobs.yaml ingress.yaml middleware-redirect.yaml; do
              if [ -f "$f" ]; then
                echo "==> kubectl apply -f $f"
                sudo kubectl apply -f "$f"
              fi
            done

            sudo kubectl set image deployment/trimly-co-ke-deployment \
              web=ghcr.io/justinelut/trimly-co-ke:${IMAGE_TAG} \
              -n trimly-co-ke

            sudo kubectl rollout status deployment/trimly-co-ke-deployment \
              -n trimly-co-ke --timeout=8m

            echo "✅ Deployed ghcr.io/justinelut/trimly-co-ke:${IMAGE_TAG}"

      - name: Summary
        if: always()
        run: |
          echo "### Deploy summary" >> $GITHUB_STEP_SUMMARY
          echo "- Image: \`ghcr.io/justinelut/trimly-co-ke:${{ needs.build.outputs.image-tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Namespace: \`trimly-co-ke\`" >> $GITHUB_STEP_SUMMARY
          echo "- Deployment: \`trimly-co-ke-deployment\`" >> $GITHUB_STEP_SUMMARY
          echo "- URL: https://trimly.co.ke" >> $GITHUB_STEP_SUMMARY
