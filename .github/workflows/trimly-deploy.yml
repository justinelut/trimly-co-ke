# =============================================================================
# Trimly — build & deploy to K3s
#
# On every push to main:
#   1. Build the Docker image
#   2. Push to ghcr.io/<owner>/trimly-co-ke:<sha> and :latest
#   3. SSH into the K3s server, kubectl apply manifests, set the new image
#      tag on the Deployment, and wait for the rollout
#
# Prisma migrations are NOT run here (deliberate — see AGENTS.md §2 and the
# Trimly build brief §2). Run them by hand after a schema change with:
#   kubectl delete job trimly-co-ke-migrate -n trimly-co-ke --ignore-not-found
#   kubectl apply -f k8s/migrate-job.yaml
#   kubectl logs -f job/trimly-co-ke-migrate -n trimly-co-ke
# =============================================================================
name: Build & Deploy

on:
  push:
    branches: [main]
    paths:
      # Only trigger Trimly deploy when files relevant to it change.
      # Cal-only paths (cron-*.yml, app-store internals, etc.) won't redeploy.
      - 'apps/web/**'
      - 'packages/prisma/schema.prisma'
      - 'packages/**'
      - 'k8s/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/trimly-deploy.yml'
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false        # never cancel a running deploy

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/trimly-co-ke
  K3S_NAMESPACE: trimly-co-ke
  K3S_DEPLOYMENT: trimly-co-ke-deployment
  K3S_CONTAINER: web

jobs:
  # ---------------------------------------------------------------------------
  # 1. Build & push to GHCR
  # ---------------------------------------------------------------------------
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute short SHA tag
        id: tag
        run: echo "tag=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Build on ARM server via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Public NEXT_PUBLIC_* values are inlined into the JS bundle at
          # build time, so they have to flow through here as build-args.
          # Falsy/empty -> the bundle treats the var as absent (no GA, no
          # GTM, no verification meta), which is the right behaviour for
          # preview / no-key environments.
          NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}
          NEXT_PUBLIC_GTM_ID: ${{ vars.NEXT_PUBLIC_GTM_ID }}
          NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION }}
          TRIMLY_WHATSAPP_NUMBER: ${{ vars.TRIMLY_WHATSAPP_NUMBER }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: IMAGE_TAG,GHCR_USER,GHCR_TOKEN,NEXT_PUBLIC_GA_ID,NEXT_PUBLIC_GTM_ID,NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION,TRIMLY_WHATSAPP_NUMBER
          command_timeout: 30m
          script: |
            set -e

            # Ensure repo exists on server
            if [ ! -d /opt/trimly-co-ke/.git ]; then
              sudo rm -rf /opt/trimly-co-ke
              sudo git clone https://${GHCR_USER}:${GHCR_TOKEN}@github.com/justinelut/trimly-co-ke.git /opt/trimly-co-ke
              sudo chown -R ubuntu:ubuntu /opt/trimly-co-ke
            fi

            cd /opt/trimly-co-ke

            # Update code
            git remote set-url origin https://${GHCR_USER}:${GHCR_TOKEN}@github.com/justinelut/trimly-co-ke.git 2>/dev/null || true
            git fetch origin main
            git reset --hard origin/main

            # Login to GHCR
            echo "${GHCR_TOKEN}" | sudo docker login ghcr.io -u "${GHCR_USER}" --password-stdin

            sudo DOCKER_BUILDKIT=1 docker build \
              --build-arg NEXT_PUBLIC_WEBAPP_URL=https://trimly.co.ke \
              --build-arg NEXTAUTH_URL=https://trimly.co.ke/api/auth \
              --build-arg NEXT_PUBLIC_API_V2_URL=https://trimly.co.ke/api \
              --build-arg DATABASE_URL=postgres://build:build@localhost:5432/build \
              --build-arg NEXTAUTH_SECRET=build-time-placeholder-replaced-at-runtime \
              --build-arg CALENDSO_ENCRYPTION_KEY=build_time_encryption_key_32chr \
              --build-arg CALCOM_TELEMETRY_DISABLED=1 \
              --build-arg MAX_OLD_SPACE_SIZE=6144 \
              --build-arg "NEXT_PUBLIC_GA_ID=${NEXT_PUBLIC_GA_ID}" \
              --build-arg "NEXT_PUBLIC_GTM_ID=${NEXT_PUBLIC_GTM_ID}" \
              --build-arg "NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION=${NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION}" \
              --build-arg "TRIMLY_WHATSAPP_NUMBER=${TRIMLY_WHATSAPP_NUMBER}" \
              -t ghcr.io/justinelut/trimly-co-ke:${IMAGE_TAG} \
              -t ghcr.io/justinelut/trimly-co-ke:latest \
              -f Dockerfile .

            # Push to GHCR
            sudo docker push ghcr.io/justinelut/trimly-co-ke:${IMAGE_TAG}
            sudo docker push ghcr.io/justinelut/trimly-co-ke:latest

            # Cleanup
            sudo docker image prune -f

  # ---------------------------------------------------------------------------
  # 2. Deploy to K3s via SSH (appleboy actions — handle keepalive internally)
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to K3s
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read              # mints GITHUB_TOKEN with GHCR pull rights
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Stage the .env.secret file on the runner from a SINGLE GHA secret
      # (ENV_SECRET) containing the entire multi-line .env contents.
      # Written inside k8s/ so the scp step's strip_components: 1 lands
      # everything cleanly at /opt/trimly-co-ke/k8s/. Mixed-prefix sources
      # in appleboy/scp-action don't tar-package reliably.
      - name: Stage env file on runner
        env:
          ENV_SECRET: ${{ secrets.ENV_SECRET }}
        run: |
          if [ -z "${ENV_SECRET:-}" ]; then
            echo "::error::ENV_SECRET repo secret is empty. Paste your .env.secret contents into it via Settings → Secrets and variables → Actions."
            exit 1
          fi
          # Default permissions — appleboy/scp-action's Docker container
          # runs as a different UID than the runner; 0600 files are not
          # readable across that boundary. The file is shredded on the
          # server post-apply (defense in depth).
          printf '%s\n' "$ENV_SECRET" > k8s/trimly.env.secret
          chmod 644 k8s/trimly.env.secret
          echo "Staged $(wc -l < k8s/trimly.env.secret) lines into k8s/trimly.env.secret"

      - name: Create target directory on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo mkdir -p /opt/trimly-co-ke/k8s
            sudo chown -R ubuntu:ubuntu /opt/trimly-co-ke

      # ---------------------------------------------------------------
      # Free node resources before scheduling the new pods. Two failure
      # modes this guards against, both of which we hit in production:
      #
      #   1. DiskPressure taint. The K3s node is the SAME box that runs
      #      `docker build` for our image (see the build job above), and
      #      every workflow run leaves another ~5–10 GB of intermediate
      #      layers in /var/lib/docker. Once the disk crosses ~85 % full,
      #      kubelet auto-applies node.kubernetes.io/disk-pressure:NoSchedule
      #      and EVERY pod (including db, minio, deployment, cronjobs)
      #      goes Pending until the disk drops below the eviction
      #      threshold. The taint is auto-removed once that happens.
      #
      #   2. Stuck pods from previous failed rollouts (Error /
      #      ContainerStatusUnknown / Pending forever) hold the
      #      ReplicaSet's quota. Garbage-collecting them frees that
      #      headroom and lets the next rollout fit.
      #
      # All operations are safe to run on every deploy — `prune` and
      # `--prune` flavours never touch images currently referenced by
      # running containers, and the pod deletion explicitly scopes to
      # phases that are already terminated.
      # ---------------------------------------------------------------
      - name: Free node resources (prune Docker, k3s images, stuck pods)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 8m
          script: |
            set +e

            echo "==> Pre-clean disk state"
            df -h / | tail -1

            echo "==> Prune Docker (images >2h old, dangling builders, stopped containers, unused volumes)"
            sudo docker container prune -f >/dev/null 2>&1
            sudo docker image prune -af --filter "until=2h" >/dev/null 2>&1
            sudo docker builder prune -af --filter "until=2h" >/dev/null 2>&1
            sudo docker volume prune -f >/dev/null 2>&1
            sudo docker network prune -f >/dev/null 2>&1

            echo "==> Prune k3s containerd images (separate cache from Docker)"
            sudo k3s crictl rmi --prune >/dev/null 2>&1

            echo "==> Vacuum journald + apt logs"
            sudo journalctl --vacuum-time=2d >/dev/null 2>&1
            sudo find /var/log -type f -name "*.gz" -mtime +3 -delete 2>/dev/null || true
            sudo find /var/log -type f \( -name "*.1" -o -name "*.old" \) -delete 2>/dev/null || true

            echo "==> Post-clean disk state"
            df -h / | tail -1

            echo "==> Garbage-collect terminated pods (Failed / Succeeded / Error)"
            sudo kubectl -n trimly-co-ke delete pod \
              --field-selector=status.phase=Failed --ignore-not-found 2>/dev/null
            sudo kubectl -n trimly-co-ke delete pod \
              --field-selector=status.phase=Succeeded --ignore-not-found 2>/dev/null
            # Force-delete any pod stuck in non-Running state for >10m
            sudo kubectl -n trimly-co-ke get pods --no-headers 2>/dev/null \
              | awk '$3 != "Running" && $3 != "Completed" && $3 != "Pending" {print $1}' \
              | xargs -r -n1 sudo kubectl -n trimly-co-ke delete pod --force --grace-period=0 --ignore-not-found 2>/dev/null

            echo "==> Wait up to 60s for kubelet to clear DiskPressure / MemoryPressure taints"
            for i in $(seq 1 12); do
              taints=$(sudo kubectl get node -o jsonpath='{.items[*].spec.taints[*].key}' 2>/dev/null)
              if ! echo "$taints" | grep -qE "(disk-pressure|memory-pressure|pid-pressure)"; then
                echo "Node taints look clean: ${taints:-<none>}"
                break
              fi
              echo "Still tainted ($taints) — waiting 5s ($i/12)"
              sleep 5
            done

            echo "==> Final node state"
            sudo kubectl describe node | grep -E "^Taints:|DiskPressure|MemoryPressure|PIDPressure" | head -10

            # Always exit 0 — best-effort cleanup never blocks the deploy.
            exit 0

      - name: Copy k8s manifests + env file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # All sources share the k8s/ prefix (env file is staged into k8s/
          # by the previous step) so strip_components: 1 works uniformly.
          source: "k8s/namespace.yaml,k8s/configmap.yaml,k8s/postgres.yaml,k8s/minio.yaml,k8s/deploy.yaml,k8s/cronjobs.yaml,k8s/ingress.yaml,k8s/middleware-redirect.yaml,k8s/trimly.env.secret"
          target: "/opt/trimly-co-ke/k8s/"
          strip_components: 1

      - name: Apply manifests and roll deployment
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image-tag }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_PULL_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_CREDS: ${{ secrets.GOOGLE_API_CREDENTIALS }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: IMAGE_TAG,GHCR_USERNAME,GHCR_PULL_TOKEN,GOOGLE_CREDS
          command_timeout: 12m
          script: |
            set -e
            cd /opt/trimly-co-ke/k8s

            NS=trimly-co-ke
            DEP=trimly-co-ke-deployment
            LABEL=app=trimly-co-ke
            ENV_FILE=/opt/trimly-co-ke/k8s/trimly.env.secret

            # 1. Ensure namespace exists
            sudo kubectl apply -f namespace.yaml

            # 2. Sync the app/db Secret from the single .env file we just
            #    scp'd from GHA. Every KEY=VALUE line in ENV_SECRET (the
            #    repo secret) becomes a key in the K8s Secret.
            #    --dry-run=client | apply makes this idempotent.
            if [ ! -s "$ENV_FILE" ]; then
              echo "::error::Staged env file is missing or empty at $ENV_FILE"
              exit 1
            fi
            # Append Google creds (JSON can't go in env-file directly due to = in URLs)
            printf 'GOOGLE_API_CREDENTIALS=%s\n' "$GOOGLE_CREDS" >> "$ENV_FILE"
            sudo kubectl create secret generic trimly-co-ke-secret -n "$NS" \
              --from-env-file="$ENV_FILE" \
              --dry-run=client -o yaml \
              | sudo kubectl apply -f -
            echo "==> trimly-co-ke-secret synced from $(wc -l < $ENV_FILE) env lines"

            # 3. Wipe the plaintext env file from the server (defense in depth;
            #    K8s now holds the values in the Secret, no need for the file).
            sudo rm -f "$ENV_FILE"

            # 4. Sync the GHCR image-pull Secret using the auto-issued
            #    GITHUB_TOKEN (no manual PAT needed). permissions:packages:read
            #    on this job lets the token pull from GHCR.
            sudo kubectl create secret docker-registry ghcr-pull-secret -n "$NS" \
              --dry-run=client -o yaml \
              --docker-server=ghcr.io \
              --docker-username="${GHCR_USERNAME}" \
              --docker-password="${GHCR_PULL_TOKEN}" \
              --docker-email="ops@trimly.co.ke" \
              | sudo kubectl apply -f -
            echo "==> ghcr-pull-secret synced (via GITHUB_TOKEN)"

            # 4. Apply the rest of the manifests (namespace already done above).
            for f in configmap.yaml postgres.yaml minio.yaml deploy.yaml cronjobs.yaml ingress.yaml middleware-redirect.yaml; do
              if [ -f "$f" ]; then
                echo "==> kubectl apply -f $f"
                sudo kubectl apply -f "$f"
              fi
            done

            sudo kubectl set image deployment/$DEP \
              web=ghcr.io/justinelut/trimly-co-ke:${IMAGE_TAG} \
              -n $NS

            # Rolling out with a background rollout-status + foreground
            # poll loop. The poll emits pod state every 15s so SSH stays
            # warm AND we see what's happening live. On failure we dump
            # describe + logs (current + previous) — diagnose without
            # needing to SSH in.
            sudo kubectl rollout status "deployment/$DEP" -n "$NS" --timeout=8m &
            ROLLOUT_PID=$!

            while kill -0 $ROLLOUT_PID 2>/dev/null; do
              sleep 15
              echo "---- $(date -u +%H:%M:%S) pod state ----"
              sudo kubectl -n "$NS" get pods -l $LABEL -o wide --no-headers 2>/dev/null || true
              POD=$(sudo kubectl -n "$NS" get pods -l $LABEL \
                --sort-by=.metadata.creationTimestamp \
                -o jsonpath='{.items[-1:].metadata.name}' 2>/dev/null || echo "")
              if [ -n "$POD" ]; then
                echo "---- container logs (last 30 lines) ----"
                sudo kubectl -n "$NS" logs "$POD" --tail=30 2>/dev/null || true
                echo "---- previous container logs (last 30 lines) ----"
                sudo kubectl -n "$NS" logs "$POD" --previous --tail=30 2>/dev/null || true
                sudo kubectl -n "$NS" describe pod "$POD" 2>/dev/null \
                  | awk '/^Events:/,0' | head -n 12 || true
              fi
            done

            wait $ROLLOUT_PID
            RC=$?

            if [ $RC -ne 0 ]; then
              echo ""
              echo "========================================"
              echo " ROLLOUT FAILED — DIAGNOSTIC DUMP"
              echo "========================================"
              echo ""
              echo "==> All pods in namespace:"
              sudo kubectl -n "$NS" get pods -o wide 2>&1 || true
              echo ""
              echo "==> Recent events (sorted, last 30):"
              sudo kubectl -n "$NS" get events --sort-by=.lastTimestamp 2>&1 | tail -30 || true
              echo ""
              echo "==> describe pod (newest matching $LABEL):"
              sudo kubectl -n "$NS" describe pod -l $LABEL 2>&1 | tail -n 80 || true
              echo ""
              echo "==> current logs (tail 200):"
              sudo kubectl -n "$NS" logs deployment/$DEP --tail=200 --all-containers=true 2>&1 || true
              echo ""
              echo "==> previous logs (if crashed):"
              sudo kubectl -n "$NS" logs deployment/$DEP --tail=200 --all-containers=true --previous 2>&1 || true
              exit $RC
            fi

            echo "✅ Deployed ghcr.io/justinelut/trimly-co-ke:${IMAGE_TAG}"

            # Post-rollout: seed TrimlyPlan + Paystack app rows (idempotent).
            # Uses psql directly against the db pod — bypasses prisma's
            # migration-state check which blocks db execute when there are
            # failed migration records.
            echo "==> Post-rollout seed (idempotent)"
            DB_POD=$(sudo kubectl -n "$NS" get pods -l app=trimly-co-ke,component=postgres --field-selector=status.phase=Running -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
            if [ -n "$DB_POD" ]; then
              sudo kubectl -n "$NS" exec -i "$DB_POD" -- psql -U trimly-co-ke -d trimly-co-ke_db -c "UPDATE \"_prisma_migrations\" SET \"finished_at\" = NOW(), \"applied_steps_count\" = 1, \"rolled_back_at\" = NULL WHERE \"finished_at\" IS NULL OR \"rolled_back_at\" IS NOT NULL;" 2>/dev/null || true
              sudo kubectl -n "$NS" exec -i "$DB_POD" -- psql -U trimly-co-ke -d trimly-co-ke_db -c "CREATE TABLE IF NOT EXISTS \"TrimlyPlan\" (id TEXT PRIMARY KEY, slug TEXT UNIQUE NOT NULL, name TEXT NOT NULL, \"cutsPerMonth\" INTEGER NOT NULL, \"priceKES\" INTEGER NOT NULL, \"intervalMonths\" INTEGER NOT NULL DEFAULT 1, \"paystackPlanCode\" TEXT, \"isActive\" BOOLEAN NOT NULL DEFAULT true); INSERT INTO \"TrimlyPlan\" (id, slug, name, \"cutsPerMonth\", \"priceKES\", \"intervalMonths\", \"isActive\") VALUES ('plan_starter','starter','Starter',2,3200,1,true),('plan_regular','regular','Regular',4,5600,1,true),('plan_executive','executive','Executive',4,7800,1,true) ON CONFLICT (slug) DO NOTHING;" \
                && echo "==> Plans seeded" || echo "==> Plan seed failed (non-critical)"
              sudo kubectl -n "$NS" exec -i "$DB_POD" -- psql -U trimly-co-ke -d trimly-co-ke_db -c "INSERT INTO \"App\" (slug, \"dirName\", keys, categories, \"createdAt\", \"updatedAt\", enabled) VALUES ('paystack','paystackpayment','{\"secret_key\":\"\",\"public_key\":\"\"}',ARRAY['payment']::\"AppCategories\"[],NOW(),NOW(),true) ON CONFLICT (slug) DO NOTHING;" 2>/dev/null || true
              sudo kubectl -n "$NS" exec -i "$DB_POD" -- psql -U trimly-co-ke -d trimly-co-ke_db -c "INSERT INTO \"Credential\" (type, key, \"appId\") SELECT 'paystack_payment', '{}'::jsonb, 'paystack' WHERE NOT EXISTS (SELECT 1 FROM \"Credential\" WHERE type = 'paystack_payment' AND \"appId\" = 'paystack');" 2>/dev/null || true
              echo "==> Seed complete"
            else
              echo "==> No running DB pod found, skipping seed"
            fi

      - name: Summary
        if: always()
        run: |
          echo "### Deploy summary" >> $GITHUB_STEP_SUMMARY
          echo "- Image: \`ghcr.io/justinelut/trimly-co-ke:${{ needs.build.outputs.image-tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Namespace: \`trimly-co-ke\`" >> $GITHUB_STEP_SUMMARY
          echo "- Deployment: \`trimly-co-ke-deployment\`" >> $GITHUB_STEP_SUMMARY
          echo "- URL: https://trimly.co.ke" >> $GITHUB_STEP_SUMMARY
