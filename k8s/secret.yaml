# =============================================================================
# TEMPLATE ONLY — DO NOT COMMIT POPULATED VALUES.
# =============================================================================
# This file documents the shape of the Kubernetes Secret. Real values are
# applied out-of-band by the operator using `kubectl create secret generic`
# or `kubectl apply` from a copy that lives OUTSIDE git (e.g. ~/secrets/).
#
# To create the populated Secret from this template:
#   1. Copy this file to ~/secrets/trimly-co-ke-secret.yaml
#   2. Fill in every REPLACE_ME with a real value
#   3. Apply: kubectl apply -f ~/secrets/trimly-co-ke-secret.yaml
#   4. Never commit the populated file to git.
#
# Or use the imperative form (preferred, no file on disk):
#   kubectl create secret generic trimly-co-ke-secret \
#     --namespace=trimly-co-ke \
#     --from-literal=POSTGRES_PASSWORD='...' \
#     --from-literal=DATABASE_URL='postgres://...' \
#     --from-literal=NEXTAUTH_SECRET='...' \
#     ... (one --from-literal per key below)
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: trimly-co-ke-secret
  namespace: trimly-co-ke
  labels:
    app: trimly-co-ke
type: Opaque
stringData:
  # ---- Database ----
  POSTGRES_PASSWORD: "REPLACE_ME"
  # Full connection string used by Prisma in the Next.js app.
  # Format: postgres://<user>:<pwd>@<service>:5432/<db>?schema=public
  DATABASE_URL: "postgres://trimly-co-ke:REPLACE_ME@trimly-co-ke-db:5432/trimly-co-ke_db?schema=public"

  # ---- NextAuth ----
  NEXTAUTH_SECRET: "REPLACE_ME"                     # `openssl rand -base64 32`

  # ---- Paystack ----
  PAYSTACK_SECRET_KEY: "sk_live_REPLACE_ME"
  PAYSTACK_WEBHOOK_SECRET: "REPLACE_ME"             # used for HMAC signature verification

  # ---- Transactional email (Resend) ----
  RESEND_API_KEY: "re_REPLACE_ME"

  # ---- SMS (Africa's Talking) ----
  AT_USERNAME: "REPLACE_ME"
  AT_API_KEY: "REPLACE_ME"

  # ---- MinIO admin credentials (boot the MinIO server) ----
  MINIO_ROOT_USER: "trimly_admin"
  MINIO_ROOT_PASSWORD: "REPLACE_ME"                 # `openssl rand -base64 24`

  # ---- App-scoped MinIO access (created via mc after first boot) ----
  STORAGE_ACCESS_KEY: "REPLACE_ME"
  STORAGE_SECRET_KEY: "REPLACE_ME"

  # ---- OAuth providers (NextAuth) ----
  GOOGLE_CLIENT_ID: "REPLACE_ME.apps.googleusercontent.com"
  GOOGLE_CLIENT_SECRET: "REPLACE_ME"

  # ---- Observability ----
  POSTHOG_KEY: "phc_REPLACE_ME"
  POSTHOG_HOST: "https://eu.posthog.com"
  SENTRY_DSN: "https://REPLACE_ME@sentry.io/REPLACE_ME"

  # ---- Cron auth (shared bearer token between CronJob and the Next.js app) ----
  CRON_SECRET: "REPLACE_ME"                         # `openssl rand -hex 32`
