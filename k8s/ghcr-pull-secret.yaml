# =============================================================================
# TEMPLATE ONLY — DO NOT COMMIT POPULATED VALUES.
# =============================================================================
# Image pull secret so K3s can pull from ghcr.io.
# Create it imperatively on the K3s server (preferred — no file on disk):
#
#   kubectl create secret docker-registry ghcr-pull-secret \
#     --namespace=trimly-co-ke \
#     --docker-server=ghcr.io \
#     --docker-username=<github-username> \
#     --docker-password=<github-PAT-with-read:packages> \
#     --docker-email=<your-email>
#
# Then the Deployment references it via `imagePullSecrets: [{ name: ghcr-pull-secret }]`.
#
# If the GHCR package is set to public, this secret is NOT required and the
# Deployment can drop `imagePullSecrets` entirely.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-pull-secret
  namespace: trimly-co-ke
  labels:
    app: trimly-co-ke
type: kubernetes.io/dockerconfigjson
data:
  # Base64-encoded docker config JSON. Generate with:
  #   echo -n '{"auths":{"ghcr.io":{"username":"USER","password":"PAT","auth":"<base64 USER:PAT>"}}}' | base64 -w0
  .dockerconfigjson: REPLACE_ME_BASE64_DOCKERCONFIG
